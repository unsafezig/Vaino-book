# Suomenkielinen kirja. Rakenna: cd fi && quarto render

project:
  type: book
  output-dir: ../_site/fi
  resources:
    - ../Cover
    - ../Figures
    - ../Assets

book:
  title: "Väinö – tekoälynatiivi käyttöjärjestelmä Zigillä"
  subtitle: "Arkkitehtuuri, capabilityt ja labrat"
  author: "Mikko Huuskonen"
  date: "today"
  language: fi
  cover-image: "../Cover/cover-artv3.png"
  repo-url: https://github.com/Mikko-Huuskonen-Pro/Vaino-book
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - Chapters/01-vision.qmd
    - Chapters/02-architecture.qmd
    - Chapters/03-boot-build.qmd
    - Chapters/04-memory.qmd
    - Chapters/05-processes.qmd
    - Chapters/06-ipc-capabilities.qmd
    - Chapters/07-syscalls.qmd
    - Chapters/08-drivers.qmd
    - Chapters/09-userland-fs.qmd
    - Chapters/10-plugins.qmd
    - Chapters/11-snapshot-healing.qmd
    - Chapters/12-vsl.qmd
    - Chapters/13-ai-generation.qmd
    - Chapters/14-security.qmd
    - Chapters/15-testing.qmd
    - Chapters/16-roadmap.qmd
    - Chapters/17-real-hardware.qmd
    - Chapters/references.qmd

bibliography: ../Assets/references.bib

highlight-style: github
format:
  html:
    lang: fi
    theme:
      light: [cosmo]
      dark: [darkly, ../Assets/theme-dark.scss]

website:
  site-url: https://mikko-huuskonen-pro.github.io/Vaino-book/fi/
